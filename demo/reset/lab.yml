# The demo's lab: what visitors manage. The reset container brings it up and
# rebuilds it from scratch at every reset (project morche-demo-lab), so the
# main compose file only needs the lab network.
name: morche-demo-lab

x-lab: &lab
  image: ${LAB_IMAGE:-ghcr.io/morcheh-cloud/demo-lab:latest}
  restart: unless-stopped
  runtime: ${LAB_RUNTIME:-sysbox-runc}
  networks: [lab]
  mem_limit: 768m
  cpus: 1
  pids_limit: 512
  logging: &logs
    driver: json-file
    options: { max-size: "5m", max-file: "2" }

services:
  lab-web-1:
    <<: *lab
    container_name: lab-web-1
    hostname: web-1
    environment: { LAB_PASSWORD: "${LAB_PASSWORD}", LAB_ROLE: web }

  lab-web-2:
    <<: *lab
    container_name: lab-web-2
    hostname: web-2
    environment: { LAB_PASSWORD: "${LAB_PASSWORD}", LAB_ROLE: web }

  lab-docker-1:
    <<: *lab
    container_name: lab-docker-1
    hostname: docker-1
    mem_limit: 1536m
    environment: { LAB_PASSWORD: "${LAB_PASSWORD}", LAB_ROLE: docker }

  lab-postgres:
    image: postgres:18-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${LAB_PASSWORD}
      POSTGRES_DB: shop
    networks: [lab]
    mem_limit: 256m
    logging: *logs

  lab-mariadb:
    image: mariadb:11.8
    container_name: lab-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${LAB_PASSWORD}
      MARIADB_DATABASE: blog
    networks: [lab]
    mem_limit: 384m
    logging: *logs

  lab-redis:
    image: redis:8-alpine
    container_name: lab-redis
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --requirepass "$$LAB_PASSWORD" --maxmemory 64mb']
    environment:
      LAB_PASSWORD: ${LAB_PASSWORD}
    networks: [lab]
    logging: *logs

  lab-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lab-minio
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: morche
      MINIO_ROOT_PASSWORD: ${LAB_PASSWORD}
    networks: [lab]
    mem_limit: 384m
    logging: *logs

networks:
  lab:
    name: morche-demo-lab
    external: true
