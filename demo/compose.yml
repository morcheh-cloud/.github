# Morche's public demo: the panel, open to anyone through one "Enter the live
# demo" button, with throwaway lab servers to try it on. Everything goes back
# to the seeded state every DEMO_RESET_MINUTES. See README.md.
#
# Every image is prebuilt, so this one file is all a stack manager (Arcane,
# Portainer…) needs, plus the values in .env.example.
#
# Put your reverse proxy (Nginx Proxy Manager, Traefik, Caddy…) on the
# PROXY_NETWORK network and point it at the gateway:
#   DEMO_DOMAIN      -> http://morche-demo-gateway:3200
#   DEMO_API_DOMAIN  -> http://morche-demo-gateway:8080  (WebSockets on)
#
# Networks keep visitors in the sandbox:
#   proxy  — your proxy and the gateway only.
#   core   — gateway, panel, backend, Postgres, Redis, the reset job. No way out.
#   lab    — the backend and the lab servers (made by the reset job). No way
#            out, no route to core, and the backend's API doesn't listen there.
name: morche-demo

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # The only way in from your proxy. Hands requests on and passes the
  # visitor's address in a header the backend believes (TRUST_PROXY), after
  # dropping any a visitor sent themselves.
  gateway:
    <<: *restart
    image: nginx:1.29-alpine
    container_name: morche-demo-gateway
    depends_on: [backend, frontend]
    networks: [proxy, core]
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        map $$http_upgrade $$connection_upgrade { default upgrade; "" close; }
        # The address your proxy saw (Nginx Proxy Manager sets X-Real-IP);
        # without one, the proxy's own.
        map $$http_x_real_ip $$visitor { "" $$remote_addr; default $$http_x_real_ip; }
        proxy_http_version 1.1;
        proxy_set_header Host $$host;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection $$connection_upgrade;
        proxy_set_header X-Real-IP $$visitor;
        proxy_set_header X-Forwarded-For $$visitor;
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_buffering off;
        client_max_body_size 1g;
        server { listen 3200; location / { proxy_pass http://frontend:3200; } }
        server { listen 8080; location / { proxy_pass http://172.29.10.10:8080; } }
        EOF
        exec nginx -g 'daemon off;'

  postgres:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: morche
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: morche
    volumes: [pgdata:/var/lib/postgresql]
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morche -d morche"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:8-alpine
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *restart
    image: ghcr.io/morcheh-cloud/backend:${MORCHE_VERSION:-latest}
    container_name: morche-demo-backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: production
      # The API listens on its core address only, so a lab server can't
      # reach it (or fake X-Forwarded-For past the sign-in limits).
      HTTP_ADDR: 172.29.10.10:8080
      DATABASE_URL: postgres://morche:${POSTGRES_PASSWORD}@postgres:5432/morche?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY}
      SETUP_TOKEN: ${SETUP_TOKEN:?set SETUP_TOKEN}
      PANEL_URL: https://${DEMO_DOMAIN:?set DEMO_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DEMO_DOMAIN}
      TRUST_PROXY: "true"
      DEMO_MODE: "true"
      DEMO_USER: demo
      DEMO_RESET_INTERVAL: ${DEMO_RESET_MINUTES:-60}m
      # Playbooks run on this machine: never without the sandbox (and the
      # demo account can't start one anyway).
      ANSIBLE_SANDBOX: bwrap
      SERVER_SAMPLE_INTERVAL: 30s
      SOFTWARE_CHECK_INTERVAL: 1h
      TZ: UTC
    networks:
      core: { ipv4_address: 172.29.10.10 }
      # Only for reaching the lab servers; the API doesn't listen here.
      lab: {}

  frontend:
    <<: *restart
    image: ghcr.io/morcheh-cloud/frontend:${MORCHE_VERSION:-latest}
    depends_on: [backend]
    environment:
      API_URL: https://${DEMO_API_DOMAIN:?set DEMO_API_DOMAIN}
    networks: [core]

  # Seeds the demo on its first start, then resets it on the clock. It
  # starts and rebuilds the lab and stops the backend during a reset, so it
  # holds the Docker socket: it sits on core only, out of the lab's reach.
  reset:
    <<: *restart
    image: ghcr.io/morcheh-cloud/demo-reset:${DEMO_VERSION:-latest}
    depends_on: [backend]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SETUP_TOKEN: ${SETUP_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      LAB_PASSWORD: ${LAB_PASSWORD:?set LAB_PASSWORD}
      LAB_IMAGE: ghcr.io/morcheh-cloud/demo-lab:${DEMO_VERSION:-latest}
      LAB_RUNTIME: ${LAB_RUNTIME:-sysbox-runc}
      DEMO_RESET_MINUTES: ${DEMO_RESET_MINUTES:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [core]

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
  core:
    internal: true
    ipam:
      config: [{ subnet: 172.29.10.0/24 }]
  lab:
    name: morche-demo-lab
    internal: true

volumes:
  pgdata:
