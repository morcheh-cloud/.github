# Builds the public demo's own images (demo/) and publishes them:
#   ghcr.io/<owner>/demo-lab    the lab servers (Debian, systemd, Docker)
#   ghcr.io/<owner>/demo-reset  the seed and reset job
# :latest on every push to main that touches demo/, plus :sha-<short>.
name: demo-images

on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/demo-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [lab, reset]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/demo-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # amd64 only: the lab image is built by running Debian, which is slow
      # under emulation. Add linux/arm64 here for an arm64 host.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: demo/${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=demo-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.image }}
