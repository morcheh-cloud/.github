<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Morche: your servers, one panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset=".55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glow1)"/>
    <rect width="1200" height="340" fill="url(#glow2)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- mark: three stacked servers joined by one line -->
  <g transform="translate(72 84)">
    <rect width="64" height="64" rx="16" fill="url(#brand)"/>
    <g fill="#070b18">
      <rect x="14" y="15" width="36" height="9" rx="3"/>
      <rect x="14" y="28" width="36" height="9" rx="3"/>
      <rect x="14" y="41" width="36" height="9" rx="3"/>
    </g>
    <g fill="#22e4ff">
      <circle cx="44" cy="19.5" r="2"/>
      <circle cx="44" cy="32.5" r="2"/>
      <circle cx="44" cy="45.5" r="2"/>
    </g>
  </g>

  <text x="156" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#brand)">morche</text>

  <text x="74" y="200" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#e6ecff">Your servers, one panel.</text>
  <text x="74" y="236" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#93a0c4">Terminals, files, containers, databases, backups and alerts,</text>
  <text x="74" y="262" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#93a0c4">all over plain SSH. Nothing to install on your servers.</text>

  <!-- terminal card -->
  <g transform="translate(690 62)">
    <rect width="440" height="216" rx="14" fill="#0a0f1f" stroke="#ffffff" stroke-opacity=".1"/>
    <rect width="440" height="34" rx="14" fill="#141b31"/>
    <rect y="20" width="440" height="14" fill="#141b31"/>
    <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="5.5" fill="#febc2e"/>
    <circle cx="56" cy="17" r="5.5" fill="#28c840"/>
    <text x="220" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b7799">~ / morche</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
      <text x="22" y="66"><tspan fill="#22e4ff">$</tspan><tspan fill="#e6ecff"> curl -fsSL …/install.sh | sh</tspan></text>
      <text x="22" y="96" fill="#8b95b8"><tspan fill="#34d399">✓</tspan> Docker 27 · Compose 2</text>
      <text x="22" y="120" fill="#8b95b8"><tspan fill="#34d399">✓</tspan> Wrote .env with fresh secrets</text>
      <text x="22" y="144" fill="#8b95b8"><tspan fill="#34d399">✓</tspan> Backend is up · Panel is up</text>
      <rect x="22" y="160" width="396" height="36" rx="8" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".45"/>
      <text x="36" y="183" fill="#34d399" font-weight="700">✓ Morche is ready <tspan fill="#c7d2fe" font-weight="400">→ localhost:3200</tspan></text>
    </g>
  </g>
</svg>
